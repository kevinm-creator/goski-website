<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Off piste | GoSki</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#020617">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon/icon-32.png">
  <style>
    @font-face { font-family: "Inter"; src: url("/fonts/inter-latin-wght.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: linear-gradient(180deg, #020617, #070d2f 60%, #072348); color: #f8fafc; font-family: "Inter", system-ui, sans-serif; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
    h1 { margin: 28px 0 0; font-size: clamp(2.2rem, 7vw, 3.6rem); font-weight: 800; letter-spacing: -.04em; line-height: 1.05; }
    p { margin: 14px 0 0; color: #94a3b8; font-size: 1.1rem; }
    a { display: inline-block; margin-top: 28px; padding: 10px 18px; border: 1px solid rgba(96,165,250,.4); border-radius: 12px; background: #2563eb; color: #fff; font-weight: 600; text-decoration: none; }
    a:hover { background: #3b82f6; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/icon/icon-180.png" alt="">
    <h1>You&rsquo;ve gone off piste.</h1>
    <p>That page isn&rsquo;t on the map.</p>
